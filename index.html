<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de Compras - Marcelo Diniz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f4f8;
            padding: 12px;
            max-width: 100%;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 4px;
            font-size: 22px;
        }

        .subtitulo {
            text-align: center;
            color: #718096;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .form-container {
            background: white;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 14px;
        }

        .linha {
            display: flex;
            gap: 10px;
        }

        .linha div {
            flex: 1;
        }

        input, select, button {
            width: 100%;
            padding: 14px 12px;
            margin: 6px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3182ce;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            padding: 14px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:active {
            background-color: #2b6cb0;
        }

        .soma-total {
            background: #ebf8ff;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 14px;
            border: 2px solid #90cdf4;
        }

        .soma-total strong {
            font-size: 20px;
            color: #2c5282;
        }

        .abas {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .aba {
            flex: 1;
            padding: 12px 8px;
            background: #e2e8f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: normal;
            font-size: 15px;
            color: #2d3748;
        }

        .aba.ativa {
            background-color: #3182ce;
            color: white;
        }

        .busca {
            margin-bottom: 12px;
        }

        .item {
            background: white;
            padding: 14px;
            border-radius: 12px;
            margin: 8px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .item.comprado {
            opacity: 0.75;
        }

        .item.comprado .nome-produto {
            text-decoration: line-through;
            color: #718096;
        }

        .cabecalho-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .info-principal {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .info-principal input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-top: 2px;
            cursor: pointer;
        }

        .nome-produto {
            font-weight: bold;
            font-size: 16px;
            color: #1a202c;
            word-break: break-word;
        }

        .detalhes {
            margin-top: 8px;
            font-size: 14px;
            color: #4a5568;
            line-height: 1.5;
        }

        .categoria {
            display: inline-block;
            font-size: 12px;
            color: #718096;
            background: #edf2f7;
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 6px;
        }

        .valor-item {
            color: #2f855a;
            font-weight: bold;
            font-size: 15px;
        }

        .btn-excluir {
            background-color: #e53e3e;
            padding: 8px 10px;
            font-size: 14px;
            width: auto;
            margin: 0;
            border-radius: 8px;
            min-width: 60px;
        }

        .btn-excluir:active {
            background-color: #c53030;
        }

        .btn-limpar {
            background-color: #ed8936;
            margin-top: 18px;
            font-size: 15px;
            padding: 12px;
        }

        .btn-limpar:active {
            background-color: #dd6b20;
        }

        .vazio {
            text-align: center;
            color: #718096;
            padding: 35px 20px;
            font-size: 15px;
        }

        .data-historico {
            font-size: 12px;
            color: #718096;
            margin-top: 6px;
        }

        small {
            font-size: 12px;
            color: #718096;
        }
    </style>
</head>
<body>

    <h1>🛒 Lista de Compras</h1>
    <p class="subtitulo">Marcelo Diniz — Controle de Gastos</p>

    <!-- Formulário -->
    <div class="form-container">
        <input type="text" id="nomeItem" placeholder="Nome do produto (ex: Arroz)" required autocomplete="off">
        
        <div class="linha">
            <div>
                <input type="number" id="quantidade" placeholder="Qtd" min="1" value="1">
            </div>
            <div>
                <input type="number" id="valorUnitario" placeholder="Preço R$" step="0.01" min="0" inputmode="decimal">
            </div>
        </div>

        <select id="categoria">
            <option value="alimentos">🥦 Alimentos</option>
            <option value="limpeza">🧹 Limpeza</option>
            <option value="higiene">🧴 Higiene</option>
            <option value="outros">📦 Outros</option>
        </select>

        <button onclick="adicionarItem()">➕ Adicionar à Lista</button>
    </div>

    <!-- Soma Total -->
    <div class="soma-total">
        Valor Total: <strong>R$ <span id="valorTotal">0,00</span></strong>
    </div>

    <!-- Abas -->
    <div class="abas">
        <button class="aba ativa" onclick="mostrarAba('lista')">📋 Lista</button>
        <button class="aba" onclick="mostrarAba('historico')">📜 Histórico</button>
    </div>

    <!-- Busca -->
    <input type="text" class="busca" id="busca" placeholder="🔍 Buscar produto..." oninput="filtrarItens()" autocomplete="off">

    <!-- Lista Atual -->
    <div id="lista-container">
        <div id="lista-itens"></div>
    </div>

    <!-- Histórico -->
    <div id="historico-container" style="display: none;">
        <div id="lista-historico"></div>
        <button class="btn-limpar" onclick="limparHistorico()">🗑️ Limpar Histórico</button>
    </div>


    <script>
        let lista = JSON.parse(localStorage.getItem('listaCompras')) || [];
        let historico = JSON.parse(localStorage.getItem('historicoCompras')) || [];
        let abaAtual = 'lista';

        const categoriasNomes = {
            alimentos: '🥦 Alimentos',
            limpeza: '🧹 Limpeza',
            higiene: '🧴 Higiene',
            outros: '📦 Outros'
        };

        // Salvar tudo automaticamente
        function salvar() {
            localStorage.setItem('listaCompras', JSON.stringify(lista));
            localStorage.setItem('historicoCompras', JSON.stringify(historico));
            calcularTotal();
        }

        // Calcular valor total da lista
        function calcularTotal() {
            let total = 0;
            lista.forEach(item => {
                total += (item.quantidade * item.valorUnitario);
            });
            document.getElementById('valorTotal').textContent = total.toFixed(2).replace('.', ',');
        }

        // Adicionar novo item
        function adicionarItem() {
            const nome = document.getElementById('nomeItem').value.trim();
            const quantidade = parseInt(document.getElementById('quantidade').value) || 1;
            let valorUnitario = document.getElementById('valorUnitario').value.replace(',', '.');
            valorUnitario = parseFloat(valorUnitario) || 0;
            const categoria = document.getElementById('categoria').value;

            if (!nome) {
                alert('⚠️ Digite o nome do produto!');
                return;
            }

            const novoItem = {
                id: Date.now(),
                nome: nome,
                quantidade: quantidade,
                valorUnitario: valorUnitario,
                categoria: categoria,
                comprado: false,
                dataAdicao: new Date().toLocaleString('pt-BR')
            };

            lista.push(novoItem);

            // Limpar campos
            document.getElementById('nomeItem').value = '';
            document.getElementById('quantidade').value = '1';
            document.getElementById('valorUnitario').value = '';

            salvar();
            renderizarLista();
        }

        // Marcar como comprado / desmarcar
        function marcarComprado(id) {
            const item = lista.find(i => i.id === id);
            if (item) {
                item.comprado = !item.comprado;
                if (item.comprado) {
                    item.dataCompra = new Date().toLocaleString('pt-BR');
                    historico.unshift(item);
                    lista = lista.filter(i => i.id !== id);
                }
                salvar();
                renderizarLista();
                renderizarHistorico();
            }
        }

        // Excluir item da lista
        function excluirItem(id) {
            if (confirm('Excluir este item?')) {
                lista = lista.filter(i => i.id !== id);
                salvar();
                renderizarLista();
            }
        }

        // Renderizar lista atual
        function renderizarLista(filtro = '') {
            const container = document.getElementById('lista-itens');
            const filtrados = lista.filter(item => 
                item.nome.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                container.innerHTML = '<p class="vazio">📋 Nenhum item na lista.<br>Adicione produtos acima!</p>';
                return;
            }

            container.innerHTML = filtrados.map(item => {
                const subtotal = (item.quantidade * item.valorUnitario).toFixed(2).replace('.', ',');
                return `
                <div class="item">
                    <div class="cabecalho-item">
                        <div class="info-principal">
                            <input type="checkbox" ${item.comprado ? 'checked' : ''} 
                                   onchange="marcarComprado(${item.id})">
                            <div>
                                <div class="nome-produto">${item.nome}</div>
                                <div class="detalhes">
                                    Qtd: ${item.quantidade} × R$ ${item.valorUnitario.toFixed(2).replace('.', ',')} = 
                                    <span class="valor-item">R$ ${subtotal}</span>
                                </div>
                                <span class="categoria">${categoriasNomes[item.categoria]}</span>
                            </div>
                        </div>
                        <button class="btn-excluir" onclick="excluirItem(${item.id})">✕</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Renderizar histórico
        function renderizarHistorico() {
            const container = document.getElementById('lista-historico');
            if (historico.length === 0) {
                container.innerHTML = '<p class="vazio">📜 Nenhum item comprado ainda.<br>Marque um item como comprado!</p>';
                return;
            }

            container.innerHTML = historico.map(item => {
                const subtotal = (item.quantidade * item.valorUnitario).toFixed(2).replace('.', ',');
                return `
                <div class="item comprado">
                    <div class="nome-produto">✅ ${item.nome}</div>
                    <div class="detalhes">
                        Qtd: ${item.quantidade} × R$ ${item.valorUnitario.toFixed(2).replace('.', ',')} = 
                        <span class="valor-item">R$ ${subtotal}</span>
                    </div>
                    <span class="categoria">${categoriasNomes[item.categoria]}</span>
                    <div class="data-historico">Comprado em: ${item.dataCompra}</div>
                </div>
                `;
            }).join('');
        }

        // Filtrar/buscar itens
        function filtrarItens() {
            const termo = document.getElementById('busca').value;
            renderizarLista(termo);
        }

        // Alternar entre Lista e Histórico
        function mostrarAba(nomeAba) {
            abaAtual = nomeAba;
            document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
            event.target.classList.add('ativa');

            document.getElementById('lista-container').style.display = nomeAba === 'lista' ? 'block' : 'none';
            document.getElementById('historico-container').style.display = nomeAba === 'historico' ? 'block' : 'none';
            document.getElementById('busca').style.display = nomeAba === 'lista' ? 'block' : 'none';

            if (nomeAba === 'historico') renderizarHistorico();
        }

        // Limpar histórico completo
        function limparHistorico() {
            if (confirm('⚠️ Tem certeza?\nO histórico será apagado para sempre!')) {
                historico = [];
                salvar();
                renderizarHistorico();
            }
        }

        // Carregar tudo ao abrir a página
        renderizarLista();
        calcularTotal();
    </script>
</body>
</html>
